<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temas</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- NavBar -->
    <div th:replace="Elementos/NavBar :: NavBar"> </div>

    <!-- MAIN LAYOUT -->
    <div class="container-fluid flex-grow-1">
        <div class="row">

            <!-- SIDEBAR IZQUIERDA -->
            <div class="col-3 bg-light vh-100 p-3">
                <div class="accordion" id="sidebarTemas"></div>
            </div>

            <!-- CONTENIDO DERECHA -->
            <div class="col-9">
                <div id="contenido" class="p-4">

                    <div class="inicio-contenido text-center text-secondary">

                        <div class="mb-4">

                            <i class="bi bi-filetype-html fs-1 text-danger mx-2"></i>

                            <i class="bi bi-filetype-css fs-1 text-primary mx-2"></i>

                            <i class="bi bi-filetype-js fs-1 text-warning mx-2"></i>

                            <i class="bi bi-globe fs-1 text-success mx-2"></i>

                            <i class="bi bi-hdd-network fs-1 text-dark mx-2"></i>

                        </div>

                        <h1 class="mb-3 fw-bold">
                            Plataforma de Aprendizaje Web
                        </h1>

                        <p class="fs-5">
                            Seleccione un tema del menú lateral para comenzar.
                        </p>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script th:src="@{/js/Temas.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Footer -->
    <div th:replace="Elementos/Footer:: Footer"> </div>
</body>
</html>
